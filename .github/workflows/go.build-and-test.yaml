name: Go build and test (castor)
on:
  pull_request:
    paths:
      - 'go/**'
      - '.github/workflows/go.build-and-test.yaml'
  push:
    branches:
      - 'master'
    paths:
      - 'go/**'
jobs:
  go-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race ./... -skip e2e
      - name: Build image
        run: docker build -t castor-go:ci .
